// 全局Gradle初始化脚本 - 配置TLS和Maven仓库
gradle.projectsLoaded {
    rootProject.allprojects {
        repositories {
            // 清除默认仓库并添加Aliyun镜像
            all { ArtifactRepository repo ->
                if (repo instanceof MavenArtifactRepository) {
                    if (repo.url.toString().contains("repo1.maven") || 
                        repo.url.toString().contains("repo.maven") ||
                        repo.url.toString().contains("maven.apache")) {
                        project.logger.warn("Using Aliyun Maven mirror instead of ${repo.url}")
                    }
                }
            }
            // 添加Aliyun仓库
            maven { url 'https://maven.aliyun.com/repository/public' }
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        }
    }
}
