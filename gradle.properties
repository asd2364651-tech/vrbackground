# 项目gradle属性配置文件

# Android gradle插件版本
android.useAndroidX=true
android.enableJetifier=true

# 构建功能
android.enableOnDemandModules=true
android.enableDexingArtifactTransform=true

# 性能优化
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2048m -Dhttps.protocols=TLSv1.2,TLSv1.3 -Djdk.tls.client.protocols=TLSv1.2,TLSv1.3

# 编译优化
android.lint.checkReleaseBuilds=false
android.enablePackingOptions=true

# Gradle缓存
org.gradle.caching=true

# TLS 和网络配置
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.https.v3Support=false
systemProp.jdk.tls.client.protocols=TLSv1.2,TLSv1.3
systemProp.sun.security.ssl.allowUnsafeRenegotiation=true
